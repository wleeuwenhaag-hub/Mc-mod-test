name: Build AuraFX
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuraFX-source/AuraFX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: AuraFX-jar
          path: |
            AuraFX-source/AuraFX/build/libs/*.jar
            !AuraFX-source/AuraFX/build/libs/*-sources.jar
